name: Clone Repo to Path

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository utama
        uses: actions/checkout@v4

      - name: Clone MobileGlues Repository
        run: |
          rm -rf Natives/external/MobileGlues
          
          git clone https://github.com/MobileGL-Dev/MobileGlues.git Natives/external/MobileGlues
          
          rm -rf Natives/external/MobileGlues/.git
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Natives/external/MobileGlues/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Clone and update MobileGlues repository [skip ci]" && git push)
