name: Development build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Development build

    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: brew install temurin@8 ldid make cmake wget
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export SLIMMED=1
          export PLATFORM="2" # Menambahkan variabel PLATFORM untuk menargetkan iOS
          gmake -j$(sysctl -n hw.ncpu) package
          gmake -j$(sysctl -n hw.ncpu) package TROLLSTORE_JIT_ENT=1

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: com.congcq.hynis
          path: artifacts/com.congcq.hynis-*.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@v4
        with:
          name: com.congcq.hynis-trollstore
          path: artifacts/com.congcq.hynis-*.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@v4
        with:
          name: com.congcq.hynis.slimmed
          path: artifacts/com.congcq.hynis.slimmed-*.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@v4
        with:
          name: com.congcq.hynis.slimmed-trollstore
          path: artifacts/com.congcq.hynis.slimmed-*.tipa

      - name: Upload jre
        uses: actions/upload-artifact@v4
        with:
          name: java_runtimes
          path: artifacts/java_runtimes/*

      - name: Upload mobileglues.dylib
        uses: actions/upload-artifact@v4
        with:
          name: libmobileglues.dylib
          path: Natives/build/libmobileglues.dylib
